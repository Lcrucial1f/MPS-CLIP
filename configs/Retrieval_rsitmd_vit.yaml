# Settings of the released RSITMD checkpoint (2 GPUs x 128 = 256 per step).
train_file: ['data/finetune/rsitmd_train1.json']
val_file: 'data/finetune/rsitmd_test1.json'
test_file: 'data/finetune/rsitmd_test1.json'
image_root: 'data/rsitmd'
train_sub_root: 'data/rsitmd/train_sub1'
val_sub_root: 'data/rsitmd/test_sub1'
test_sub_root: 'data/rsitmd/test_sub1'

image_res: 224
batch_size_train: 128
batch_size_test: 8
batch_size_test_text: 128
gradient_checkpointing: True

embed_dim: 512
temp1: 0.07
is_mps: True
model: 'vit'
pretrained: 'laion2b_s34b_b79k'

save_epoch: False
save_num_epoch: 10
optimizer: {opt: adamW, lr: 0.0004, weight_decay: 0.04, lr_mult: 2}
schedular: {sched: linear, lr: 0.0004, epochs: 35, num_warmup_steps: 0.1}

use_multi_view: True
mv_k: 4
mv_mlp: True
mv_margin: 0.2
mv_dropout: 0.0
